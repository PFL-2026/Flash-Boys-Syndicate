<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Boys Syndicate</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flash Boys">

<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pfl-2026.github.io/Flash-Boys-Syndicate/">
<meta property="og:title" content="Flash Boys Syndicate">

<meta property="og:image" content="https://pfl-2026.github.io/Flash-Boys-Syndicate/share.png">

<meta name="twitter:image" content="https://pfl-2026.github.io/Flash-Boys-Syndicate/share.png">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style id="css">:root{
  color-scheme:dark;
  --bg:#0A0A0B; --surface:#141416; --raise:#1B1B1E; --line:#2A2A2F;
  --ink:#F4F1EA; --muted:#9C978B; --gold:#E8B64C; --gold-hi:#F7D886;
  --win:#3DDC84; --loss:#FF5A4F; --void:#8A867D; --open:#E8B64C;
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
.d{font-family:var(--display);font-stretch:72%;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Hero */
.hero{position:relative;padding-top:12px}
.hero > img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 32px rgba(232,182,76,.16))}
.hero-text{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:14px 2px 0}
.hero h1{margin:0;font-family:var(--display);font-stretch:68%;font-weight:900;font-size:40px;line-height:.85;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 span{display:block;font-size:12px;font-stretch:110%;font-weight:700;letter-spacing:.42em;color:var(--gold);margin-top:7px}
.hero p{margin:0 0 2px;font-size:11px;color:var(--muted);text-align:right;max-width:120px}
/* Totals */
.strip{display:grid;grid-template-columns:1.35fr 1fr 1fr .8fr;margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{padding:10px 8px 9px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0;padding-left:2px}
.strip small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip b{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:21px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.strip .pl b{font-size:27px;font-weight:900}
.pos{color:var(--win)} .neg{color:var(--loss)}

h2{display:flex;align-items:center;gap:10px;font-family:var(--display);font-stretch:110%;font-weight:700;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* Live treble */
#live{margin-top:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.card-head b{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:7px}
.card-head b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 0 3px rgba(61,220,132,.18)}
.card-head span{font-size:12px;color:var(--muted)}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.leg{display:grid;grid-template-columns:32px 1fr auto;gap:11px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-stretch:80%;font-weight:900;font-size:15px;color:#0A0A0B;position:relative}
.av i{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:9px;font-weight:900;display:grid;place-items:center;border:2px solid var(--surface);color:#0A0A0B}
.leg.won .av i{background:var(--win)} .leg.lost .av i{background:var(--loss)} .leg.void .av i{background:var(--void)}
.lt{min-width:0}
.lt small{display:block;font-size:11px;color:var(--muted);line-height:1.25}
.lt span{display:block;font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.lt .fx{margin-top:2px}
.leg.won .lt span{color:var(--win)}
.leg.lost .lt span,.leg.void .lt span{color:var(--muted);text-decoration:line-through}
.lo{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:15px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.leg-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ctl{display:flex;gap:4px}
.ctl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--raise);font-size:13px;font-weight:800;display:grid;place-items:center;padding:0}
.ctl .w{color:var(--win)} .ctl .l{color:var(--loss)} .ctl .v{color:var(--void);font-size:11px}
.ctl button[aria-pressed="true"]{color:#0A0A0B;border-color:transparent}
.ctl .w[aria-pressed="true"]{background:var(--win)} .ctl .l[aria-pressed="true"]{background:var(--loss)} .ctl .v[aria-pressed="true"]{background:var(--void)}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.card-foot b{color:var(--ink);font-family:var(--display);font-stretch:72%;font-weight:900;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;margin-left:4px}
.card-foot .edit{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px 0 6px 10px}
.idle{border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:14px}

/* History */
.hist{display:flex;flex-direction:column}
.hrow{border-bottom:1px solid var(--line)}
.hrow[open]{background:var(--surface);border-radius:12px;border-bottom-color:transparent;margin:4px 0}
.hrow summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 4px;cursor:pointer}
.hrow[open] summary{padding:11px 12px}
.hrow summary::-webkit-details-marker{display:none}
.hdate{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-stretch:80%;font-size:12px;font-weight:900;color:#0A0A0B;background:var(--void)}
.dot.won{background:var(--win)} .dot.lost{background:var(--loss)} .dot.open{background:transparent;border:1.5px solid var(--open);color:var(--open)}
.hres{text-align:right;font-family:var(--display);font-stretch:72%;font-weight:900;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.hres small{display:block;font-family:"Archivo",sans-serif;font-stretch:100%;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
.hrow .legs{padding:0 10px}
.hrow .card-foot{margin:4px 14px 12px}

/* Leaderboard */
.board{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:20px 32px 1fr auto;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.rank{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:20px;color:var(--muted);text-align:center}
.brow.leader .rank{color:var(--gold)}
.brow.leader .bname::after{content:" 👑";font-size:13px}
.bname{font-weight:700}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--win));border-radius:2px}
.bstat{text-align:right}
.bstat b{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.bstat small{display:block;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}

.banner{background:rgba(232,182,76,.1);color:var(--gold-hi);border:1px solid rgba(232,182,76,.25);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px;display:none}
.org{margin:34px 0 0;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:10px}

/* Add button + sheet */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B;border:0;border-radius:999px;padding:14px 26px;font-family:var(--display);font-stretch:90%;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:0 10px 28px rgba(232,182,76,.32),0 2px 0 rgba(255,255,255,.4) inset;display:none;align-items:center;gap:8px}
.fab img{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .2s ease;max-width:560px;margin:0 auto;visibility:hidden;pointer-events:none;overscroll-behavior:contain}
.open .scrim{display:block} .open .sheet{transform:none;visibility:visible;pointer-events:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet h3{font-family:var(--display);font-stretch:68%;font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;margin:0}
.stake{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 10px;width:120px}
.stake span{color:var(--gold);font-weight:800}
.stake input{width:100%;border:0;background:transparent;padding:10px 6px;font-size:16px;font-weight:800;outline:none}
.stake:focus-within{border-color:var(--gold)}
.legs-form{display:flex;flex-direction:column;gap:8px}
.leg-card{display:grid;grid-template-columns:1fr 76px;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
.leg-card .leg-name,.leg-card .leg-fix{grid-column:1 / -1}
.leg-card .leg-out,.leg-card .leg-custom{grid-column:1}
.leg-card [hidden]{display:none}
.leg-card input,.leg-card select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.leg-card select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.leg-card .leg-name{font-weight:800;color:var(--gold)}
.leg-card select:invalid{color:var(--muted)}
.leg-card input:focus,.leg-card select:focus{border-color:var(--gold);outline:none}
.err{color:var(--loss);font-size:13px;min-height:1em;margin:8px 0 0}
.preview{font-size:13px;color:var(--muted);margin:6px 0 12px;text-align:center}
.preview b{color:var(--win);font-family:var(--display);font-stretch:72%;font-weight:900;font-size:26px;line-height:1}
.sheet-btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B}
.btn.secondary{background:var(--bg);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* Sync / refresh */
.sync{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.refresh{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
.refresh .ri{display:inline-block;color:var(--gold);font-size:13px;line-height:1}
.refresh.spin .ri{animation:spin .8s linear infinite}
.refresh.ok{border-color:rgba(61,220,132,.4);color:var(--win)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Totals */
.totals{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.t-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 12px}
.t-main small{flex-basis:100%;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.t-main b{font-family:var(--display);font-stretch:70%;font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.roi{font-size:12px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--raise)}
.roi.pos{color:var(--win);background:rgba(61,220,132,.1)} .roi.neg{color:var(--loss);background:rgba(255,90,79,.1)}
.t-row{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.t-row div{padding:10px 16px 11px;border-left:1px solid var(--line)}
.t-row div:first-child{border-left:0}
.t-row small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.t-row b{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:20px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Player picker + clickable rows */
.pick-player{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:6px}
.pick-player span{font-size:13px;font-weight:700}
.pick-player select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:9px 30px 9px 12px;font-size:16px;font-weight:700;color:var(--gold);max-width:60%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
button.brow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit;font:inherit}
button.brow:last-child{border-bottom:0}
.brow .chev{color:var(--muted);font-size:18px;margin-left:2px}
.brow{grid-template-columns:20px 32px 1fr auto 10px}

/* Player page */
.profile{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.profile[hidden]{display:none}
.prof-bar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;padding:10px 12px;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.prof-nav{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
#profName{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;display:grid;place-items:center;padding:0}
.iconbtn.sm{width:34px;height:34px;border-radius:10px;font-size:20px;color:var(--gold)}
.iconbtn:disabled{opacity:.3}
.prof-body{max-width:560px;margin:0 auto;padding:16px 14px}
.prof-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.prof-head .av{width:56px;height:56px;border-radius:16px;font-size:26px}
.prof-head h3{margin:0;font-family:var(--display);font-stretch:70%;font-weight:900;font-size:34px;line-height:.95;text-transform:uppercase}
.prof-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pstats div{padding:11px 10px;border-left:1px solid var(--line);text-align:center}
.pstats div:first-child{border-left:0}
.pstats small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pstats b{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.pextra{display:flex;justify-content:space-between;gap:10px;margin:12px 2px 0;font-size:13px;color:var(--muted)}
.pextra b{color:var(--ink)}
.form{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.form i{width:16px;height:16px;border-radius:5px;display:inline-block;background:var(--void)}
.form i.won{background:var(--win)} .form i.lost{background:var(--loss)}
.picks{list-style:none;margin:0;padding:0}
.pick{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.pick .pd{font-size:12px;color:var(--muted)}
.pick .pp{font-weight:700;overflow-wrap:anywhere}
.pick .pf{display:block;font-size:12px;color:var(--muted);font-weight:400}
.pick .pr{text-align:right}
.pick .pr b{display:block;font-family:var(--display);font-stretch:80%;font-weight:800;color:var(--gold-hi);font-size:15px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--raise);color:var(--open);margin-top:3px}
.chip.won{background:rgba(61,220,132,.14);color:var(--win)} .chip.lost{background:rgba(255,90,79,.14);color:var(--loss)} .chip.void{color:var(--void)}
body.locked{overflow:hidden}

/* Two add buttons */
.fabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:none;gap:8px;padding:6px;border-radius:999px;background:rgba(20,20,22,.85);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fab-btn{border:0;border-radius:999px;padding:12px 20px;font-family:var(--display);font-stretch:90%;font-weight:800;font-size:15px;letter-spacing:.02em;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B;white-space:nowrap}
.fab-btn.alt{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
/* Single form */
.single-form[hidden]{display:none}
.joint{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.joint::before{content:"★";display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--gold);color:#0A0A0B;font-size:12px}
.joint b{color:var(--ink)}
.single-card{grid-template-columns:1fr 76px}
.single-card .leg-custom{grid-column:1}
.legs-form[hidden]{display:none}
/* Single on cards */
.av.joint-av{background:var(--gold);font-size:14px}
.spill{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;font-size:13px;font-weight:700;overflow:hidden}
.spill i{flex:none;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--void);color:#0A0A0B}
.spill.won i{background:var(--win)} .spill.lost i{background:var(--loss)}
.spill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hrow summary{grid-template-columns:54px minmax(0,1fr) auto}

/* Model entry */
.model-card{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit}
.mc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B;font-family:var(--display);font-stretch:80%;font-weight:900;font-size:20px}
.mc-t b{display:block;font-size:15px}
.mc-t small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.model-card .chev{color:var(--muted);font-size:20px}
/* Predictions page */
#predsTitle{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:22px;text-transform:uppercase}
.pintro{font-size:13px;color:var(--muted);margin:0 0 6px}
.pday{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:20px 2px 6px;font-weight:700}
.pm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:8px}
.pm-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline;font-weight:700;font-size:15px}
.pm-teams span:last-child{text-align:right}
.pm-teams small{font-size:11px;color:var(--muted);font-weight:500}
.pbar{display:flex;height:30px;border-radius:9px;overflow:hidden;margin:10px 0 8px;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:14px}
.pbar span{display:flex;align-items:center;justify-content:center;min-width:34px;color:#0A0A0B;white-space:nowrap}
.pbar .ph{background:var(--gold)} .pbar .pd{background:#5A5750;color:var(--ink)} .pbar .pa{background:var(--ink)}
.pbar .fav{box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.pm-foot{display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;color:var(--muted)}
.pm-foot div:nth-child(2){text-align:center} .pm-foot div:last-child{text-align:right}
.pm-foot b{display:block;color:var(--ink);font-size:13px}
.pm-meta{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pm-meta b{color:var(--ink)}
.pnote{font-size:12px;color:var(--muted);line-height:1.5;margin:22px 2px 0;padding-top:14px;border-top:1px solid var(--line)}
.pnote b{color:var(--ink)}

.dstat{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--void);border-radius:10px;padding:9px 12px;margin:10px 0 4px}
.dstat b{color:var(--ink);font-size:13px}
.dstat.ok{border-left-color:var(--win)} .dstat.bad{border-left-color:var(--loss)}
.news{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.news .tag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--raise);color:var(--gold)}
.news .tag.ok{background:rgba(61,220,132,.14);color:var(--win)}
.news .miss b{color:var(--ink)}
.news .shift{color:var(--gold-hi);font-weight:700}

/* Team news on prediction cards */
.tn{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.tn-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tn-top b{color:var(--ink);font-size:13px}
.str{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--raise)}
.str.hi{color:var(--win)} .str.mid{color:var(--gold)} .str.lo{color:var(--loss)}
.outs{font-size:12px;color:var(--muted);line-height:1.4}
.outs .ol{color:var(--gold-hi);font-weight:700}
.xis summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:12px;margin-top:6px;list-style:none}
.xis summary::-webkit-details-marker{display:none}
.xis summary::after{content:" ▾"}
.xis[open] summary::after{content:" ▴"}
.xicols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.xicol b{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}
.xicol ol{margin:0;padding-left:18px;font-size:12px;color:var(--ink);line-height:1.55}
.xibtn{margin-top:8px;align-self:flex-start;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800}
/* Lineup editor */
.lpane .scrim{z-index:50} .lpane .sheet{z-index:51}
.lpane.open .scrim{display:block} .lpane.open .sheet{transform:none;visibility:visible;pointer-events:auto}
.lsheet h3{font-size:24px}
.lphint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.lptabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.lptabs button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:800;font-size:14px}
.lptabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.lptabs button .c{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.lptabs button .c.ok{color:var(--win)}
.lplist{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.lprow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.lprow:last-child{border-bottom:0}
.lprow input{width:20px;height:20px;accent-color:var(--gold);margin:0}
.lprow .nm{font-weight:700;font-size:14px}
.lprow .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.lprow .flag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(255,90,79,.14);color:var(--loss)}
.lprow .flag.d{background:rgba(232,182,76,.14);color:var(--gold)}
.lpgrp{padding:6px 12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);background:var(--raise)}

.news .tag.warn{background:rgba(232,182,76,.14);color:var(--gold)}
.vline{font-size:11px;color:var(--muted);margin-top:-1px}
.xicol .fm{display:block;font-size:11px;color:var(--gold);margin:-2px 0 4px}
.xicol li.um{color:var(--gold-hi)}
.xicol li.um::after{content:" *"}

/* Selector + suggestions */
.psel{display:flex;flex-direction:column;gap:8px;margin:2px 0 10px}
.psel select{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 36px 12px 14px;font-size:16px;font-weight:800;color:var(--gold);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.pgw{font-weight:800;color:var(--gold);padding:4px 2px}
.pseg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.pseg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:13px;font-weight:800;color:var(--muted)}
.pseg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B}
.sg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;position:relative;overflow:hidden}
.sg::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.sg-h{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:24px;text-transform:uppercase;line-height:1}
.sg-h2{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:18px;text-transform:uppercase;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line)}
.sg-sub{font-size:12px;color:var(--muted);margin:4px 0 8px}
.sg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sg-row b{display:block;font-size:15px}
.sg-row small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.sg-r{text-align:right}
.sg-r b{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:22px;color:var(--win)}
.sg-tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.sg-tot small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sg-tot b{font-family:var(--display);font-stretch:72%;font-weight:900;font-size:28px}
.sg-value{font-size:13px;color:var(--gold-hi);margin:8px 0 10px}
.sg-btn{width:100%;margin-top:4px}
.sg-note{font-size:11px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.vchk{font-size:12px;margin-top:6px}
.vchk.pos b{color:var(--win)} .vchk.neg b{color:var(--loss)}

/* Betfair Exchange labelling */
.bfx{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:#F2EFE6;color:#0A0A0B;white-space:nowrap;vertical-align:middle}
.bfx::before{content:"⇄";font-size:11px}
.exh{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--muted)}
.exg{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
.exg div{display:flex;flex-direction:column;gap:2px}
.exg div:first-child{align-items:flex-start} .exg div:nth-child(2){align-items:center} .exg div:last-child{align-items:flex-end}
.exg b{font-family:var(--display);font-stretch:80%;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.vt{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--raise);color:var(--muted)}
.vt.pos{background:rgba(61,220,132,.14);color:var(--win)}
.sgx{display:flex!important;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px}
.sg-ex{margin:10px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sg-ex div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sg-ex b{font-size:14px}
.sg-ex small{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
.sg-h2 .bfx{font-size:11px;margin-left:4px}
.dstat b .bfx{margin-right:2px}

/* Predictions, compact rows */
.dsrc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 4px}
.dc{font-size:11px;font-weight:700;padding:3px 8px 3px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dc::before{content:"●";margin-right:4px;font-size:9px;color:var(--void)}
.dc.ok::before{color:var(--win)} .dc.bad::before{color:var(--loss)}
.dt{font-size:11px;color:var(--muted);margin-left:auto}
.pday{margin:16px 2px 6px}
details.gm{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
details.gm[open]{border-color:rgba(232,182,76,.45)}
details.gm > summary{list-style:none;cursor:pointer;padding:10px 12px 11px}
details.gm > summary::-webkit-details-marker{display:none}
.gm-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.gm-tags{display:flex;align-items:center;gap:5px}
.gt{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--raise);color:var(--muted)}
.gt.ok{background:rgba(61,220,132,.14);color:var(--win)} .gt.val{background:rgba(232,182,76,.16);color:var(--gold)} .gt.live{background:rgba(255,90,79,.14);color:var(--loss)}
.gm-chev{font-size:12px;color:var(--muted);transition:transform .15s}
details.gm[open] .gm-chev{transform:rotate(180deg)}
.gm-teams{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:15px;margin:3px 0 0}
.gm-teams span:last-child{text-align:right}
details.gm .pbar{height:24px;margin:7px 0 8px;font-size:12px}
.gm-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.gm-kpi div{text-align:center}
.gm-kpi div:first-child{text-align:left} .gm-kpi div:last-child{text-align:right}
.gm-kpi small{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gm-kpi b{font-family:var(--display);font-stretch:80%;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.gm-body{padding:2px 12px 12px;border-top:1px solid var(--line)}
.mk{padding:10px 0 4px;border-bottom:1px dashed var(--line)}
.mk:last-child{border-bottom:0}
.mk-h{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.mt{display:grid;grid-template-columns:1fr 54px 54px;row-gap:5px;column-gap:6px;align-items:center;font-size:13px}
.mt.c5{grid-template-columns:1fr 46px 46px 46px 62px}
.mh{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.mc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mc.l{text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .vt{font-size:10px}
.mk-n{font-size:11px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mk .tag{display:inline-block;margin-bottom:4px}
.mk .tn{margin-top:6px}
.pnote{font-size:11px;line-height:1.5}

.sg-tot.three{grid-template-columns:repeat(3,1fr)}
.sg-tot b.pos{color:var(--win)} .sg-tot b.neg{color:var(--loss)}
.sg-warn{font-size:12px;color:var(--gold-hi);background:rgba(232,182,76,.1);border-radius:8px;padding:8px 10px;margin:0 0 10px}

.b365{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;letter-spacing:.04em;padding:3px 8px;border-radius:6px;border:1.5px solid var(--gold);color:var(--ink);white-space:nowrap;vertical-align:middle}
.b365::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--win);box-shadow:0 0 0 2px rgba(61,220,132,.2)}
.mt.c6{grid-template-columns:1fr 40px 42px 42px 42px 58px;column-gap:5px}
.mt.c6 .mc.l{font-size:12px}

/* Top tabs */
.toptabs{position:fixed;top:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:1fr 1.25fr;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) max(14px, calc((100vw - 560px)/2 + 14px)) 8px;background:rgba(10,10,11,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
:root{padding-top:0}
.tt{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:11px 10px;font-family:var(--display);font-stretch:85%;font-weight:900;font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.tt.on{color:var(--ink);border-color:var(--ink)}
.tt.pred{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B;border-color:transparent;box-shadow:0 6px 18px rgba(232,182,76,.28)}
.tt-ic{width:18px;height:18px;flex:none}
.tt-n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#0A0A0B;color:var(--gold-hi);font-size:11px;font-weight:900;display:inline-grid;place-items:center;font-stretch:100%}
.tt-n:empty{display:none}
.hero{padding-top:10px}
#root{padding-top:calc(62px + env(safe-area-inset-top,0px))}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}

/* Bet form legs */
.leg-card{display:flex!important;flex-direction:column;gap:8px;padding:10px!important}
.lc-head{display:flex;align-items:center;gap:8px}
.lc-n{width:24px;height:24px;flex:none;border-radius:7px;background:var(--gold);color:#0A0A0B;display:grid;place-items:center;font-family:var(--display);font-stretch:80%;font-weight:900;font-size:14px}
.lc-head select{flex:1}
.lgchips{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr;gap:4px}
.lgchips button,.obtns button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:800}
.lgchips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(232,182,76,.08)}
.obtns{display:grid;grid-template-columns:1fr .75fr 1fr;gap:5px}
.obtns[hidden]{display:none}
.obtns button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:var(--ink);min-width:0}
.obtns .ob-t{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obtns .ob-p{font-size:11px;color:var(--muted);font-weight:700}
.obtns button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:transparent;color:#0A0A0B}
.obtns button[aria-pressed="true"] .ob-p{color:#3a2a08}
.lc-odds{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.lc-odds input{width:110px!important;text-align:right;font-weight:800}
.leg-card .leg-custom{grid-column:auto!important}

.mk .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--raise);color:var(--gold);margin-bottom:4px}
.mk .tag.ok{background:rgba(61,220,132,.14);color:var(--win)} .mk .tag.warn{background:rgba(232,182,76,.14);color:var(--gold)}
.mk .vline{font-size:11px;color:var(--muted);margin:0 0 4px}
.mt .mh:first-child{text-align:left}
.mt .mc,.mt .mh{white-space:nowrap}

.sg-h2.first{margin-top:0;padding-top:0;border-top:0}
.trk{margin-top:10px}
.trk-r{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.trk-gw{color:var(--muted);font-weight:700;font-size:12px}
.trk-l{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk-r b.pos{color:var(--win)} .trk-r b.neg{color:var(--loss)}

.mdl{color:var(--muted)} .mdl.up{color:var(--win)} .mdl.dn{color:var(--loss)}
.sg + .sg{margin-top:10px}
.trk-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:12px 0 2px}
.sg-r small{white-space:nowrap}

.sg-r.plain b{color:var(--ink);font-size:17px}
.sg-rule{color:var(--gold-hi)!important}

/* Navigation: the two tabs stay on top of every page */
.toptabs{z-index:45}
.profile{top:calc(62px + env(safe-area-inset-top,0px));padding-top:0}
#preds .prof-bar{display:none}
#preds .prof-body{padding-top:12px}
.tt.pred:not(.on){background:var(--surface);color:var(--gold);border-color:rgba(232,182,76,.5);box-shadow:none}
.tt.pred.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0A0A0B;border-color:transparent}
.tt.pred:not(.on) .tt-n{background:var(--gold);color:#0A0A0B}
.scrim{z-index:46!important} .sheet{z-index:47!important}
.lpane .scrim{z-index:50!important} .lpane .sheet{z-index:51!important}

.gm-cap{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
details.gm .pbar{margin-top:4px}
.cmp{display:flex!important;gap:8px;justify-content:flex-end;font-size:12px;color:var(--muted)}
.cmp .mdl{font-weight:700}
.sg-r .mini{margin-top:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800}
.sg-empty{font-size:13px;color:var(--muted);margin:6px 0 10px}
.sg-learn{font-size:12px;color:var(--gold-hi);background:rgba(232,182,76,.08);border-radius:8px;padding:8px 10px;margin:12px 0 0;line-height:1.45}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--win);color:#0A0A0B;font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{max-height:calc(100vh - 70px - env(safe-area-inset-top,0px))!important}

.when{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;margin:0 0 10px}
.when button{border:0;background:transparent;border-radius:8px;padding:9px;font-size:13px;font-weight:800;color:var(--muted)}
.when button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.pastdate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pastdate[hidden]{display:none}
.pastdate input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;color:var(--ink);color-scheme:dark}
.obtns.wl{grid-template-columns:1fr 1fr!important}
.obtns.wl button[data-r="won"][aria-pressed="true"]{background:var(--win);color:#0A0A0B}
.obtns.wl button[data-r="lost"][aria-pressed="true"]{background:var(--loss);color:#0A0A0B}
.single-form .obtns.wl{margin-top:8px}

.pmoney{grid-template-columns:repeat(3,1fr)!important;margin-top:8px}
.pmoney b{font-size:22px!important}
.pnote2{font-size:11px;color:var(--muted);margin:6px 2px 0}

.whosin{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.whosin > span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
.pchips button[aria-pressed="true"]{background:rgba(232,182,76,.12);border-color:var(--gold);color:var(--gold)}
.pchips button[aria-pressed="true"]::before{content:"✓ "}

/* Compact header */
.hero{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;padding-top:14px!important;margin-bottom:2px}
.hero > img{width:76px!important;height:76px!important;max-height:none!important;aspect-ratio:auto!important;border-radius:18px;object-fit:cover;object-position:50% 30%;filter:none!important;box-shadow:0 0 0 2px var(--gold),0 8px 20px rgba(0,0,0,.4)}
.hero::after{display:none!important}
.hero-text{display:contents!important}
.hero h1{font-size:30px!important;margin:0!important}
.hero h1 span{font-size:10px!important;margin-top:4px!important}
.hero .sync{align-items:flex-end}
.hero p{max-width:none!important;white-space:nowrap}
.board-hint{font-size:12px;color:var(--muted);margin:-4px 2px 6px}

.dline{font-size:11px;color:var(--muted);margin:2px 2px 8px;display:flex;align-items:center;gap:6px}
.dline::before{content:"●";font-size:9px}
.dline.ok::before{color:var(--win)} .dline.bad::before{color:var(--loss)} .dline.bad{color:var(--loss)}
.scorechips{display:flex;gap:6px;flex-wrap:wrap}
.scorechips span{background:var(--raise);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.scorechips b{color:var(--ink);font-family:var(--display);font-stretch:80%;font-size:15px}
.sg{padding:12px 14px!important}
.sg-h{font-size:21px!important}
.sg-sub{margin:3px 0 6px!important}
.sg-note{margin:10px 0 0!important;font-size:11px!important}
.sg-learn{font-size:11px!important;padding:6px 10px!important;margin-top:10px!important}
.leg-card{gap:6px!important;padding:8px!important}
.leg-card select,.leg-card input{padding:8px 10px!important}
.lgchips button{padding:6px 4px!important}
.obtns button{padding:6px 4px!important}
.lc-odds input{width:96px!important}

.hmid{display:flex;flex-direction:column;gap:4px;min-width:0}
.hwho{font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="markup"><nav class="toptabs" aria-label="Sections">
  <button type="button" class="tt on" id="tabHome" aria-current="page">Syndicate</button>
  <button type="button" class="tt pred" id="openPreds"><svg class="tt-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z" fill="currentColor"/><path d="M12 7V2.5M16 10l4-1.5M14.5 14.5l2.5 4M9.5 14.5L7 18.5M8 10L4 8.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>The Model<span class="tt-n" id="mcSub"></span></button>
</nav>
<div class="wrap">
  <header class="hero">
    <img id="heroImg" alt="The Flash Boys">
    <div class="hero-text">
      <h1>Flash Boys<span>Syndicate</span></h1>
      <div class="sync"><p id="sub"></p><button type="button" id="refreshBtn" class="refresh"><span class="ri">↻</span><span id="refreshTxt">Refresh</span></button></div>
    </div>
  </header>

  <div id="banner" class="banner"></div>

  <section class="totals" aria-label="Syndicate totals">
    <div class="t-main"><small>Syndicate profit</small><b id="tProfit">£0</b><span id="tRoi" class="roi"></span></div>
    <div class="t-row">
      <div><small>Staked</small><b id="tStaked">£0</b></div>
      <div><small>Returned</small><b id="tReturned">£0</b></div>
      <div><small>Record</small><b id="tRecord">0–0</b></div>
    </div>
  </section>

  <section id="live" aria-label="Live treble"></section>

  <h2>History</h2>
  <div id="list" class="hist"></div>

  <h2>Leaderboard</h2>
  <p class="board-hint">Tap a name to see their record.</p>
  <select id="playerSel" hidden aria-hidden="true"></select>
  <div id="board" class="board"></div>

  <p class="org"><button type="button" id="orgBtn" class="linkbtn">Organiser sign-in</button></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fabs" id="fab"><button class="fab-btn" id="fabTreble" type="button">+ Treble</button><button class="fab-btn alt" id="fabSingle" type="button">+ Single</button></div>

<div id="preds" class="profile" role="dialog" aria-modal="true" aria-labelledby="predsTitle" hidden>
  <div class="prof-bar">
    <button type="button" id="predsBack" class="iconbtn" aria-label="Back">←</button>
    <div class="prof-nav"><span id="predsTitle">The Model</span></div>
    <button type="button" id="predsClose" class="iconbtn" aria-label="Close">✕</button>
  </div>
  <div class="prof-body" id="predsBody"></div>
</div>

<div id="lineupPane" class="lpane">
  <div class="scrim" id="lpScrim"></div>
  <div class="sheet lsheet" role="dialog" aria-modal="true" aria-labelledby="lpTitle">
    <div class="sheet-head"><h3 id="lpTitle">Confirmed XIs</h3><button type="button" id="lpClose" class="iconbtn sm" aria-label="Close">✕</button></div>
    <p class="lphint">Tick the 11 starters for each team once lineups are announced (about an hour before kick-off). The predicted XI is ticked to start with.</p>
    <div class="lptabs"><button type="button" id="lpTabH" data-s="h"></button><button type="button" id="lpTabA" data-s="a"></button></div>
    <div id="lpList" class="lplist"></div>
    <div class="err" id="lpErr" role="alert"></div>
    <div class="sheet-btns"><button class="btn secondary" id="lpReset" type="button">Use predicted</button><button class="btn primary" id="lpSave" type="button">Save XIs</button></div>
  </div>
</div>

<div id="profile" class="profile" role="dialog" aria-modal="true" aria-labelledby="profName" hidden>
  <div class="prof-bar">
    <button type="button" id="profBack" class="iconbtn" aria-label="Back">←</button>
    <div class="prof-nav">
      <button type="button" id="profPrev" class="iconbtn sm" aria-label="Previous player">‹</button>
      <span id="profName"></span>
      <button type="button" id="profNext" class="iconbtn sm" aria-label="Next player">›</button>
    </div>
    <button type="button" id="profClose" class="iconbtn" aria-label="Close">✕</button>
  </div>
  <div class="prof-body" id="profBody"></div>
</div>

<div id="sheetRoot">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle">New treble</h3>
      <label class="stake"><span>£</span><input id="fStake" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="Stake" aria-label="Stake in pounds"></label></div>
    <div class="when" role="group" aria-label="When"><button type="button" data-w="up" aria-pressed="true">Upcoming</button><button type="button" data-w="past" aria-pressed="false">Already played</button></div>
    <div class="whosin"><span>Who’s in</span><div class="pchips" id="pChips" role="group" aria-label="Players in this bet"></div></div>
    <label class="pastdate" id="pastDate" hidden><span>Date of the game</span><input type="date" id="fDate"></label>
    <div class="single-form" id="singleForm" hidden>
      <p class="joint" id="jointNote" hidden></p>
      <div class="leg-card single-card"><input id="sPick" class="leg-custom" autocomplete="off" maxlength="100" placeholder="The bet, e.g. Haaland anytime scorer" aria-label="Single bet"><input id="sOdds" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="2.50" aria-label="Single odds"></div>
      <div class="obtns wl" id="sWL" role="group" aria-label="Result" hidden><button type="button" data-r="won">✓ Won</button><button type="button" data-r="lost">✕ Lost</button></div>
    </div>
    <div class="legs-form" id="trebleForm">
      <div class="leg-card">
        <div class="lc-head"><span class="lc-n">1</span><select id="n0" class="leg-name" aria-label="Leg 1 picked by"></select></div>
        <div class="lgchips" id="lg0" role="group" aria-label="Leg 1 league"><button type="button" data-lg="en.1">Prem</button><button type="button" data-lg="en.2">Champ</button><button type="button" data-lg="de.1">Bundesliga</button><button type="button" data-lg="other">Other</button></div>
        <select id="f0" class="leg-fix" aria-label="Leg 1 match"></select>
        <input id="x0" class="leg-custom" autocomplete="off" maxlength="80" placeholder="Type the bet, e.g. Kane to score" aria-label="Leg 1 bet" hidden>
        <div class="obtns wl" id="xWL0" role="group" aria-label="Leg 1 result" hidden><button type="button" data-r="won">✓ Won</button><button type="button" data-r="lost">✕ Lost</button></div>
        <div class="obtns" id="ob0" role="group" aria-label="Leg 1 result"></div>
        <select id="r0" class="leg-out" aria-hidden="true" tabindex="-1" hidden></select>
        <label class="lc-odds"><span>Odds</span><input id="o0" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="2.50" aria-label="Leg 1 odds"></label>
      </div>
      <div class="leg-card">
        <div class="lc-head"><span class="lc-n">2</span><select id="n1" class="leg-name" aria-label="Leg 2 picked by"></select></div>
        <div class="lgchips" id="lg1" role="group" aria-label="Leg 2 league"><button type="button" data-lg="en.1">Prem</button><button type="button" data-lg="en.2">Champ</button><button type="button" data-lg="de.1">Bundesliga</button><button type="button" data-lg="other">Other</button></div>
        <select id="f1" class="leg-fix" aria-label="Leg 2 match"></select>
        <input id="x1" class="leg-custom" autocomplete="off" maxlength="80" placeholder="Type the bet, e.g. Kane to score" aria-label="Leg 2 bet" hidden>
        <div class="obtns wl" id="xWL1" role="group" aria-label="Leg 2 result" hidden><button type="button" data-r="won">✓ Won</button><button type="button" data-r="lost">✕ Lost</button></div>
        <div class="obtns" id="ob1" role="group" aria-label="Leg 2 result"></div>
        <select id="r1" class="leg-out" aria-hidden="true" tabindex="-1" hidden></select>
        <label class="lc-odds"><span>Odds</span><input id="o1" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="2.50" aria-label="Leg 2 odds"></label>
      </div>
      <div class="leg-card">
        <div class="lc-head"><span class="lc-n">3</span><select id="n2" class="leg-name" aria-label="Leg 3 picked by"></select></div>
        <div class="lgchips" id="lg2" role="group" aria-label="Leg 3 league"><button type="button" data-lg="en.1">Prem</button><button type="button" data-lg="en.2">Champ</button><button type="button" data-lg="de.1">Bundesliga</button><button type="button" data-lg="other">Other</button></div>
        <select id="f2" class="leg-fix" aria-label="Leg 3 match"></select>
        <input id="x2" class="leg-custom" autocomplete="off" maxlength="80" placeholder="Type the bet, e.g. Kane to score" aria-label="Leg 3 bet" hidden>
        <div class="obtns wl" id="xWL2" role="group" aria-label="Leg 3 result" hidden><button type="button" data-r="won">✓ Won</button><button type="button" data-r="lost">✕ Lost</button></div>
        <div class="obtns" id="ob2" role="group" aria-label="Leg 3 result"></div>
        <select id="r2" class="leg-out" aria-hidden="true" tabindex="-1" hidden></select>
        <label class="lc-odds"><span>Odds</span><input id="o2" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="2.50" aria-label="Leg 3 odds"></label>
      </div>
    </div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="preview" id="preview"></div>
    <div class="sheet-btns">
      <button class="btn secondary" id="cancelBtn" type="button">Cancel</button>
      <button class="btn primary" id="saveBtn" type="button">Confirm bet</button>
    </div>
  </div>
</div>

    b.classList.remove("ok"); b.classList.add("spin"); $("refreshTxt").textContent = "Checking";
    var t0 = Date.now();
    lastStamp = null; etag = null;
    await Promise.all([load(), loadFixtures(), loadFootball()]);
    buildModel();
    var wait = Math.max(0, 600 - (Date.now() - t0));
    setTimeout(function(){ b.classList.remove("spin"); b.classList.add("ok"); $("refreshTxt").textContent = "Up to date";
      setTimeout(function(){ b.classList.remove("ok"); $("refreshTxt").textContent = "Refresh"; }, 2500); }, wait);
  });
  try { if(token() && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  canWrite = !!token();
  applyWriteState();
  load().then(route);
  Promise.all([loadFixtures(), loadFootball()]).then(loadHistory);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    if(Date.now() - FIX_AT > 15*60*1000) loadFixtures();
    loadFootball().then(function(){ buildModel(); render(); });
  });
  setInterval(function(){ if(document.visibilityState === "visible") load(); }, 30000);
  setInterval(async function(){ if(document.visibilityState !== "visible") return; await loadFootball(); buildModel(); render(); }, 5*60*1000);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") load(); });
})();
</script>
