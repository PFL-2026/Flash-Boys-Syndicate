<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Boys Syndicate</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flash Boys">
<meta name="theme-color" content="#0A1322">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">:root{
  color-scheme:dark;
  --bg:#0A1322; --surface:#111D31; --raise:#172741; --line:#22334F;
  --ink:#EEF1F5; --muted:#8A99B1; --red:#E2453A; --brass:#E9C27C;
  --win:#4FD18B; --loss:#FF6A5E; --void:#7D8BA3; --open:#E9C27C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
.num{font-variant-numeric:tabular-nums}

/* Hero */
.hero{position:relative;margin:0 -14px;overflow:hidden;background:#050B16}
.hero img{display:block;width:100%;height:190px;object-fit:cover;object-position:60% 35%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,34,0) 30%,var(--bg) 100%)}
.hero-text{position:absolute;left:16px;right:16px;bottom:10px;z-index:1}
.hero h1{margin:0;font:900 38px/0.9 "Big Shoulders Display",Impact,"Arial Narrow",sans-serif;letter-spacing:.01em}
.hero h1 span{display:block;font-size:18px;font-weight:700;color:var(--brass);letter-spacing:.06em;margin-top:2px}
.hero p{margin:6px 0 0;font-size:12px;color:var(--muted)}

/* Totals strip */
.strip{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.strip div{background:var(--surface);padding:9px 10px}
.strip small{display:block;font-size:11px;color:var(--muted)}
.strip b{font:900 19px/1.1 "Big Shoulders Display",Impact,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .pl b{font-size:23px}
.pos{color:var(--win)} .neg{color:var(--loss)}

h2{font:900 19px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.03em;color:var(--muted);margin:22px 0 8px}

/* Live treble card */
#live{margin-top:14px}
.card{background:linear-gradient(160deg,var(--raise),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.card-head b{font:900 17px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.04em;color:var(--brass)}
.card-head span{font-size:12px;color:var(--muted)}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.leg{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:11px;padding:7px 8px}
.leg.won{border-color:rgba(79,209,139,.35)} .leg.lost{border-color:rgba(255,106,94,.35)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#0A1322;position:relative}
.av i{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;font-style:normal;font-size:9px;display:grid;place-items:center;border:2px solid var(--surface);color:#0A1322}
.leg.won .av i{background:var(--win)} .leg.lost .av i{background:var(--loss)} .leg.void .av i{background:var(--void)}
.lt{min-width:0}
.lt small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.lt span{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg.lost .lt span,.leg.void .lt span{color:var(--muted);text-decoration:line-through}
.lo{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:4px}
.ctl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;display:grid;place-items:center;padding:0}
.ctl .w{color:var(--win)} .ctl .l{color:var(--loss)} .ctl .v{color:var(--void);font-size:12px}
.ctl button[aria-pressed="true"]{color:#0A1322;border-color:transparent}
.ctl .w[aria-pressed="true"]{background:var(--win)} .ctl .l[aria-pressed="true"]{background:var(--loss)} .ctl .v[aria-pressed="true"]{background:var(--void)}
.leg-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.card-foot b{color:var(--ink);font:900 22px/1 "Big Shoulders Display",Impact,sans-serif;font-variant-numeric:tabular-nums}
.card-foot .edit{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px 0 6px 10px}
.idle{border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px}

/* History */
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hrow summary{list-style:none;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.hrow summary::-webkit-details-marker{display:none}
.hdate{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#0A1322;background:var(--void)}
.dot.won{background:var(--win)} .dot.lost{background:var(--loss)} .dot.open{background:transparent;border:1.5px solid var(--open);color:var(--open)}
.hres{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.hres small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.hrow .legs{padding:0 10px 10px}
.hrow .card-foot{margin:8px 12px 10px}

/* Leaderboard */
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:22px 30px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rank{font:900 17px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--muted);text-align:center}
.brow:first-child .rank{color:var(--brass)}
.bname{font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--win);border-radius:3px}
.bstat{text-align:right;font-variant-numeric:tabular-nums}
.bstat b{font:900 20px/1 "Big Shoulders Display",Impact,sans-serif}
.bstat small{display:block;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}

.banner{background:rgba(233,194,124,.12);color:var(--brass);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px;display:none}
.org{margin:34px 0 0;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:10px}

/* Button + sheet */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--red);color:#fff;border:0;border-radius:999px;padding:13px 24px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(226,69,58,.4);display:none}
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.65);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .2s ease;max-width:560px;margin:0 auto}
.open .scrim{display:block} .open .sheet{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet h3{font:900 24px/1 "Big Shoulders Display",Impact,sans-serif;margin:0}
.stake{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 10px;width:120px}
.stake span{color:var(--muted);font-weight:700}
.stake input{width:100%;border:0;background:transparent;padding:10px 6px;font-size:16px;font-weight:700;outline:none}
.stake:focus-within{border-color:var(--brass)}
.legs-form{display:flex;flex-direction:column;gap:8px}
.leg-card{display:grid;grid-template-columns:1fr 76px;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
.leg-card .leg-name,.leg-card .leg-fix{grid-column:1 / -1}
.leg-card .leg-out,.leg-card .leg-custom{grid-column:1}
.leg-card [hidden]{display:none}
.leg-card input,.leg-card select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.leg-card select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.leg-card input:focus,.leg-card select:focus{border-color:var(--brass);outline:none}
.err{color:var(--loss);font-size:13px;min-height:1em;margin:8px 0 0}
.preview{font-size:14px;color:var(--muted);margin:6px 0 12px;text-align:center}
.preview b{color:var(--win);font:900 22px/1 "Big Shoulders Display",Impact,sans-serif}
.sheet-btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px}
.btn.primary{background:var(--red);color:#fff}
.btn.secondary{background:var(--bg);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

.leg-card .leg-name{font-weight:700;color:var(--brass)}
.leg-card .leg-fix:invalid,.leg-card .leg-out:invalid{color:var(--muted)}
.lt .fx{margin-top:1px}
/* keep the page scrollable everywhere */
html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet{visibility:hidden;pointer-events:none;overscroll-behavior:contain}
.open .sheet{visibility:visible;pointer-events:auto}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="markup"><div class="wrap">
  <header class="hero">
    <img id="heroImg" alt="">
    <div class="hero-text">
      <h1>Flash Boys<span>Syndicate</span></h1>
      <p id="sub"></p>
    </div>
  </header>

  <div id="banner" class="banner"></div>

  <section class="strip" aria-label="Syndicate totals">
    <div class="pl"><small>Profit</small><b id="tProfit">£0</b></div>
    <div><small>Staked</small><b id="tStaked">£0</b></div>
    <div><small>Returned</small><b id="tReturned">£0</b></div>
    <div><small>Record</small><b id="tRecord">0–0</b></div>
  </section>

  <section id="live" aria-label="Live treble"></section>

  <h2>History</h2>
  <div id="list" class="hist"></div>

  <h2>Leaderboard</h2>
  <div id="board" class="board"></div>

  <p class="org"><button type="button" id="orgBtn" class="linkbtn">Organiser sign-in</button></p>
</div>

<button class="fab" id="fab" type="button">+ New treble</button>

<div id="sheetRoot">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle">New treble</h3>
      <label class="stake"><span>£</span><input id="fStake" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="Stake" aria-label="Stake in pounds"></label></div>
    <div class="legs-form">
      <div class="leg-card"><select id="n0" class="leg-name" aria-label="Leg 1 picked by"></select><select id="f0" class="leg-fix" aria-label="Leg 1 fixture"></select><select id="r0" class="leg-out" aria-label="Leg 1 result"></select><input id="x0" class="leg-custom" autocomplete="off" maxlength="80" placeholder="Type the bet" aria-label="Leg 1 bet" hidden><input id="o0" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="Odds" aria-label="Leg 1 odds"></div>
      <div class="leg-card"><select id="n1" class="leg-name" aria-label="Leg 2 picked by"></select><select id="f1" class="leg-fix" aria-label="Leg 2 fixture"></select><select id="r1" class="leg-out" aria-label="Leg 2 result"></select><input id="x1" class="leg-custom" autocomplete="off" maxlength="80" placeholder="Type the bet" aria-label="Leg 2 bet" hidden><input id="o1" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="Odds" aria-label="Leg 2 odds"></div>
      <div class="leg-card"><select id="n2" class="leg-name" aria-label="Leg 3 picked by"></select><select id="f2" class="leg-fix" aria-label="Leg 3 fixture"></select><select id="r2" class="leg-out" aria-label="Leg 3 result"></select><input id="x2" class="leg-custom" autocomplete="off" maxlength="80" placeholder="Type the bet" aria-label="Leg 3 bet" hidden><input id="o2" class="leg-odds" autocomplete="off" inputmode="decimal" maxlength="10" placeholder="Odds" aria-label="Leg 3 odds"></div>
    </div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="preview" id="preview"></div>
    <div class="sheet-btns">
      <button class="btn secondary" id="cancelBtn" type="button">Cancel</button>
      <button class="btn primary" id="saveBtn" type="button">Add treble</button>
    </div>
  </div>
</div>

<script id="app">(function(){
  "use strict";
  function part(id){ var e = document.getElementById(id); return e ? e.textContent : ""; }
  var HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>The Flash Boys Syndicate</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">\n';

  var STATE = {bets: []};

  var bets = [];

  var $ = function(id){ return document.getElementById(id); };
  function gbp(n){
    var neg = n < 0; n = Math.abs(n);
    var s = n.toLocaleString("en-GB",{minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2});
    return (neg ? "−£" : "£") + s;
  }
  function signed(n){ return n > 0 ? "+" + gbp(n) : gbp(n); }
  function toDecimal(raw){
    if(!raw) return null;
    var s = String(raw).trim().toLowerCase().replace(/\s+/g,"");
    if(s === "evs" || s === "evens" || s === "even" || s === "evn") return 2;
    var m = s.match(/^(\d+(?:\.\d+)?)[\/\-](\d+(?:\.\d+)?)$/);
    if(m){ var a=parseFloat(m[1]), b=parseFloat(m[2]); return b>0 ? 1 + a/b : null; }
    m = s.match(/^([+\-])(\d+(?:\.\d+)?)$/);
    if(m){ var v=parseFloat(m[2]); if(v<100) return null; return m[1]==="+" ? 1 + v/100 : 1 + 100/v; }
    m = s.match(/^\d+(?:\.\d+)?$/);
    if(m){ var d=parseFloat(s); return d > 1 ? d : null; }
    return null;
  }
  // ---- Fixtures (openfootball, free, no key) ----
  var LEAGUES = [["en.1","Premier League"],["en.2","Championship"],["de.1","Bundesliga"]];
  var FIX = {}, FIX_LIST = [], FIX_STATE = "loading", FIX_AT = 0;
  var SHORT = {"Manchester United":"Man Utd","Manchester City":"Man City","Tottenham Hotspur":"Spurs","Wolverhampton Wanderers":"Wolves","Brighton & Hove Albion":"Brighton","Newcastle United":"Newcastle","West Ham United":"West Ham","Nottingham Forest":"Nott’m Forest","Sheffield United":"Sheff Utd","Sheffield Wednesday":"Sheff Wed","West Bromwich Albion":"West Brom","Queens Park Rangers":"QPR","Leeds United":"Leeds","Preston North End":"Preston","Blackburn Rovers":"Blackburn","Bolton Wanderers":"Bolton","Charlton Athletic":"Charlton","Coventry City":"Coventry","Ipswich Town":"Ipswich","Hull City":"Hull","Birmingham City":"Birmingham","Bristol City":"Bristol City","Cardiff City":"Cardiff","Derby County":"Derby","Lincoln City":"Lincoln","Norwich City":"Norwich","Stoke City":"Stoke","Swansea City":"Swansea","Bournemouth":"Bournemouth","Borussia Mönchengladbach":"Gladbach","Borussia Dortmund":"Dortmund","FC Bayern München":"Bayern","Bayer 04 Leverkusen":"Leverkusen","1. FSV Mainz 05":"Mainz","Eintracht Frankfurt":"Frankfurt","VfB Stuttgart":"Stuttgart","RB Leipzig":"Leipzig","SC Freiburg":"Freiburg","TSG 1899 Hoffenheim":"Hoffenheim","1. FC Union Berlin":"Union Berlin","SV Werder Bremen":"Werder Bremen","FC Augsburg":"Augsburg","1. FC Köln":"Köln","Hamburger SV":"Hamburg","SC Paderborn 07":"Paderborn","SV 07 Elversberg":"Elversberg","FC Schalke 04":"Schalke","VfL Wolfsburg":"Wolfsburg","FC St. Pauli":"St Pauli","1. FC Heidenheim 1846":"Heidenheim"};
  function shortName(n){ var t = String(n||"").replace(/^AFC\s+/,"").replace(/\s+(A?FC)$/,"").trim(); return SHORT[n] || SHORT[t] || t; }
  function fkey(f){ return f.lg + "|" + f.date + "|" + f.home + "|" + f.away; }
  function season(){ var d = new Date(), y = d.getFullYear(); var s = d.getMonth() >= 6 ? y : y - 1; return s + "-" + String(s + 1).slice(2); }
  function dayLabel(date){ return new Date(date + "T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}).replace(",",""); }
  function isoDay(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  async function loadFixtures(){
    FIX_AT = Date.now();
    var base = "https://raw.githubusercontent.com/openfootball/football.json/master/" + season() + "/";
    var res = await Promise.all(LEAGUES.map(function(L){ return fetch(base + L[0] + ".json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }));
    var map = {}, list = [];
    res.forEach(function(d, i){
      if(!d || !Array.isArray(d.matches)) return;
      d.matches.forEach(function(m){
        var f = {lg: LEAGUES[i][0], date: m.date, time: m.time || "", home: shortName(m.team1), away: shortName(m.team2), ft: m.score && Array.isArray(m.score.ft) ? m.score.ft : null};
        map[fkey(f)] = f; list.push(f);
      });
    });
    FIX = map; FIX_LIST = list; FIX_STATE = list.length ? "ready" : "failed";
    if($("sheetRoot").classList.contains("open")) [0,1,2].forEach(function(i){ var k=$("f"+i).value, o=$("r"+i).value; fillFixtures(i,k); fillOutcomes(i,o); });
    render();
  }
  function upcoming(){
    var from = isoDay(new Date()), t = new Date(); t.setDate(t.getDate() + 10); var to = isoDay(t);
    return FIX_LIST.filter(function(f){ return !f.ft && f.date >= from && f.date <= to; })
      .sort(function(a,b){ return (a.date + a.time).localeCompare(b.date + b.time); });
  }
  function outcomeLabel(f, o){ return o === "H" ? f.home + " win" : o === "A" ? f.away + " win" : o === "D" ? "Draw" : ""; }
  function autoResult(l){
    if(!l.fixture || !l.outcome) return null;
    var f = FIX[fkey(l.fixture)];
    if(!f || !f.ft) return null;
    var a = f.ft[0], b = f.ft[1], act = a > b ? "H" : a < b ? "A" : "D";
    return {result: act === l.outcome ? "won" : "lost", score: a + "–" + b};
  }
  function legsOf(b){
    return (Array.isArray(b.legs) ? b.legs : []).map(function(l){
      var auto = autoResult(l);
      if(auto && (!l.result || l.result === "open")) return Object.assign({}, l, {result: auto.result, score: auto.score, auto: true});
      if(auto) return Object.assign({}, l, {score: auto.score});
      return l;
    });
  }
  // Combined decimal odds; void legs count as 1.
  function comboOf(b, ignoreVoid){
    return legsOf(b).reduce(function(acc,l){ return acc * ((!ignoreVoid && l.result==="void") ? 1 : (toDecimal(l.odds)||1)); }, 1);
  }
  function statusOf(b){
    var legs = legsOf(b);
    if(!legs.length) return "open";
    if(legs.some(function(l){ return l.result==="lost"; })) return "lost";
    if(legs.every(function(l){ return l.result==="void"; })) return "void";
    if(legs.every(function(l){ return l.result==="won" || l.result==="void"; })) return "won";
    return "open";
  }
  function payoutOf(b){
    var stake = Number(b.stake) || 0, r = statusOf(b);
    if(r === "won") return stake * comboOf(b);
    if(r === "void") return stake;
    if(r === "lost") return 0;
    return null;
  }
  function potentialOf(b){ return (Number(b.stake)||0) * comboOf(b); }
  function frac(dec){ var f = dec - 1; return (f >= 10 ? Math.round(f) : Math.round(f*10)/10) + "/1"; }
  function when(ts){
    if(!ts) return "";
    var d = new Date(ts), now = new Date();
    var y = new Date(now); y.setDate(now.getDate()-1);
    var t = d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    if(d.toDateString() === now.toDateString()) return "Today " + t;
    if(d.toDateString() === y.toDateString()) return "Yesterday " + t;
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + " " + t;
  }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  var LABEL = {open:"Waiting", won:"Won", lost:"Lost", void:"Void"};

  var AV = ["#E9C27C","#7FB8FF","#F28C82","#7FE0A8","#C7A0FF","#FFB86B"];
  function avColor(name){ var i = MEMBERS.indexOf(name); if(i < 0){ i = 0; for(var k=0;k<(name||"").length;k++) i += name.charCodeAt(k); } return AV[i % AV.length]; }
  function initials(n){ return (n||"?").trim().slice(0,1).toUpperCase(); }
  function shortDate(ts){ return ts ? new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""; }

  function legItem(b, l, i){
    var lr = l.result || "open";
    var li = el("li","leg " + lr);
    var av = el("span","av",initials(l.name)); av.style.background = avColor(l.name);
    if(lr !== "open") av.appendChild(el("i",null, lr==="won"?"✓":lr==="lost"?"✕":"–"));
    li.appendChild(av);
    var lt = el("div","lt"); lt.appendChild(el("small",null,l.name||"Someone")); lt.appendChild(el("span",null,l.pick||""));
    var fx = [];
    if(l.fixture) fx.push(l.fixture.home + " v " + l.fixture.away + (l.score ? " " + l.score : " · " + new Date(l.fixture.date + "T12:00:00").toLocaleDateString("en-GB",{weekday:"short"})));
    if(canWrite && l.odds) fx.push(l.odds);
    if(fx.length) lt.appendChild(el("small","fx",fx.join(" · ")));
    li.appendChild(lt);
    var right = el("div","leg-right");
    if(!canWrite) right.appendChild(el("span","lo",l.odds||""));
    if(canWrite){
      var ctl = el("div","ctl");
      [["won","w","✓","Won"],["lost","l","✕","Lost"],["void","v","V","Void"]].forEach(function(o){
        var bt = el("button",o[1],o[2]); bt.type="button";
        bt.setAttribute("aria-pressed", lr===o[0] ? "true" : "false");
        bt.setAttribute("aria-label", o[3] + ": " + (l.pick||"leg " + (i+1)));
        bt.addEventListener("click",function(e){ e.preventDefault(); setLeg(b.id, i, lr===o[0] ? "open" : o[0]); });
        ctl.appendChild(bt);
      });
      right.appendChild(ctl);
    }
    li.appendChild(right);
    return li;
  }
  function legList(b){ var ul = el("ul","legs"); legsOf(b).forEach(function(l,i){ ul.appendChild(legItem(b,l,i)); }); return ul; }
  function foot(b){
    var r = statusOf(b), f = el("div","card-foot"), left = el("div");
    if(r === "open"){ left.appendChild(document.createTextNode("£" + (Number(b.stake)||0) + " at " + frac(comboOf(b)) + " · returns ")); left.appendChild(el("b",null,gbp(potentialOf(b)))); }
    else { var p = payoutOf(b), pl = p - (Number(b.stake)||0); left.appendChild(document.createTextNode("£" + (Number(b.stake)||0) + " at " + frac(comboOf(b)) + " · ")); left.appendChild(el("b", pl>0?"pos":pl<0?"neg":null, r==="won" ? gbp(p) : r==="void" ? "Void" : "Lost")); }
    f.appendChild(left);
    if(canWrite){ var e = el("button","edit","Edit"); e.type="button"; e.addEventListener("click",function(ev){ ev.preventDefault(); openSheet(b); }); f.appendChild(e); }
    return f;
  }

  function render(){
    var staked=0, returned=0, settledStake=0, w=0, lcount=0;
    bets.forEach(function(b){
      var r = statusOf(b); staked += Number(b.stake)||0;
      if(r !== "open"){ returned += payoutOf(b); settledStake += Number(b.stake)||0; }
      if(r === "won") w++; if(r === "lost") lcount++;
    });
    var profit = returned - settledStake;
    var tp = $("tProfit"); tp.textContent = signed(profit); tp.className = profit>0?"pos":profit<0?"neg":"";
    $("tStaked").textContent = gbp(staked);
    $("tReturned").textContent = gbp(returned);
    $("tRecord").textContent = w + "–" + lcount;
    $("sub").textContent = STATE.updatedAt ? "Updated " + when(STATE.updatedAt) : "";
    $("orgBtn").textContent = canWrite ? "Organiser: signed in. Sign out" : "Organiser sign-in";

    var live = $("live"); live.textContent = "";
    var open = bets.filter(function(b){ return statusOf(b) === "open"; });
    var done = bets.filter(function(b){ return statusOf(b) !== "open"; });
    if(!loaded){ live.appendChild(el("div","idle","Loading…")); }
    else if(!open.length){ live.appendChild(el("div","idle", canWrite ? "No live treble. Tap + New treble to put one on." : "No live treble right now.")); }
    open.forEach(function(b){
      var c = el("article","card");
      var h = el("div","card-head"); h.appendChild(el("b",null,"Live treble"));
      var landed = legsOf(b).filter(function(l){ return l.result==="won"; }).length;
      h.appendChild(el("span",null, landed ? landed + " of 3 in · " + shortDate(b.createdAt) : shortDate(b.createdAt)));
      c.appendChild(h); c.appendChild(legList(b)); c.appendChild(foot(b));
      live.appendChild(c);
    });

    var list = $("list"); list.textContent = "";
    if(loaded && !done.length) list.appendChild(el("div","empty","Settled trebles will appear here."));
    done.forEach(function(b){
      var r = statusOf(b), d = el("details","hrow"), sm = el("summary");
      sm.appendChild(el("span","hdate",shortDate(b.createdAt)));
      var dots = el("span","dots");
      legsOf(b).forEach(function(l){ var lr=l.result||"open"; var dt = el("span","dot " + lr, initials(l.name)); dt.title = (l.name||"") + ": " + (l.pick||""); dots.appendChild(dt); });
      sm.appendChild(dots);
      var p = payoutOf(b), pl = p - (Number(b.stake)||0);
      var res = el("span","hres " + (pl>0?"pos":pl<0?"neg":""), r==="won" ? signed(pl) : r==="void" ? "Void" : signed(pl));
      res.appendChild(el("small",null, r==="won" ? "Won" : r==="void" ? "Stake back" : "Lost"));
      sm.appendChild(res);
      d.appendChild(sm); d.appendChild(legList(b)); d.appendChild(foot(b));
      list.appendChild(d);
    });

    var people = {};
    MEMBERS.forEach(function(m){ people[m.toLowerCase()] = {name:m,picks:0,won:0,lost:0}; });
    bets.forEach(function(b){ legsOf(b).forEach(function(l){
      var key=(l.name||"Someone").trim(), k=key.toLowerCase();
      var p = people[k] || (people[k] = {name:key,picks:0,won:0,lost:0});
      p.picks++; if(l.result==="won") p.won++; if(l.result==="lost") p.lost++;
    }); });
    var rows = Object.keys(people).map(function(k){ var p=people[k]; var d=p.won+p.lost; p.rate = d ? p.won/d : -1; return p; })
      .sort(function(a,b){ return b.won - a.won || b.rate - a.rate || a.lost - b.lost; });
    var board = $("board"); board.textContent = "";
    rows.forEach(function(p,i){
      var r = el("div","brow");
      r.appendChild(el("span","rank",String(i+1)));
      var av = el("span","av",initials(p.name)); av.style.background = avColor(p.name); r.appendChild(av);
      var mid = el("div"); mid.appendChild(el("div","bname",p.name));
      var bar = el("div","bar"), fill = el("i"); fill.style.width = (p.rate<0?0:Math.round(p.rate*100)) + "%"; bar.appendChild(fill); mid.appendChild(bar);
      r.appendChild(mid);
      var st = el("div","bstat"); st.appendChild(el("b",null, p.won + "/" + (p.won+p.lost))); st.appendChild(el("small",null, p.rate<0 ? "no results" : Math.round(p.rate*100) + "% landed"));
      r.appendChild(st);
      board.appendChild(r);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    t.addEventListener("click",function(){
      filter = t.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){ x.setAttribute("aria-pressed", x===t ? "true":"false"); });
      render();
    });
  });

  var CUSTOM = "__custom__";
  function fillFixtures(i, sel){
    var fs = $("f"+i); fs.textContent = ""; fs.required = true;
    var ph = document.createElement("option"); ph.value = ""; ph.textContent = FIX_STATE === "loading" ? "Loading fixtures…" : FIX_STATE === "failed" ? "Fixtures unavailable" : "Choose a fixture"; fs.appendChild(ph);
    var up = upcoming(), have = false;
    if(sel && sel !== CUSTOM && !up.some(function(f){ return fkey(f) === sel; })){
      var p = sel.split("|"), g0 = document.createElement("optgroup"); g0.label = "Selected";
      var o0 = document.createElement("option"); o0.value = sel; o0.textContent = dayLabel(p[1]) + " · " + p[2] + " v " + p[3]; g0.appendChild(o0); fs.appendChild(g0);
    }
    LEAGUES.forEach(function(L){
      var games = up.filter(function(f){ return f.lg === L[0]; });
      if(!games.length) return;
      var g = document.createElement("optgroup"); g.label = L[1];
      games.forEach(function(f){ var o = document.createElement("option"); o.value = fkey(f); o.textContent = dayLabel(f.date) + " · " + f.home + " v " + f.away; g.appendChild(o); });
      fs.appendChild(g);
    });
    var gc = document.createElement("optgroup"); gc.label = "Other";
    var oc = document.createElement("option"); oc.value = CUSTOM; oc.textContent = "Something else (type it)"; gc.appendChild(oc); fs.appendChild(gc);
    fs.value = sel || "";
  }
  function fixtureFor(key){
    if(!key || key === CUSTOM) return null;
    if(FIX[key]) return FIX[key];
    var p = key.split("|"); return {lg:p[0], date:p[1], home:p[2], away:p[3]};
  }
  function fillOutcomes(i, sel){
    var key = $("f"+i).value, custom = key === CUSTOM, f = fixtureFor(key);
    $("x"+i).hidden = !custom; $("r"+i).hidden = custom;
    var rs = $("r"+i); rs.textContent = ""; rs.required = true;
    var ph = document.createElement("option"); ph.value = ""; ph.textContent = f ? "Result" : "Pick a fixture first"; rs.appendChild(ph);
    if(f) [["H",f.home + " win"],["D","Draw"],["A",f.away + " win"]].forEach(function(o){ var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; rs.appendChild(op); });
    rs.disabled = !f;
    rs.value = sel || "";
  }
  [0,1,2].forEach(function(i){
    $("f"+i).addEventListener("change", function(){ fillOutcomes(i, ""); updatePreview(); if($("f"+i).value === CUSTOM) $("x"+i).focus(); else $("r"+i).focus(); });
    $("r"+i).addEventListener("change", function(){ if($("r"+i).value) $("o"+i).focus(); });
  });
  function formLegs(){
    return [0,1,2].map(function(i){
      var key = $("f"+i).value, f = fixtureFor(key), o = $("r"+i).value;
      return {name:$("n"+i).value.trim(), key:key, custom: key === CUSTOM,
        fixture: f ? {lg:f.lg, date:f.date, home:f.home, away:f.away} : null,
        outcome: f ? o : "", pick: key === CUSTOM ? $("x"+i).value.trim() : (f && o ? outcomeLabel(f, o) : ""),
        odds:$("o"+i).value.trim()};
    });
  }
  function updatePreview(){
    var legs = formLegs(), stake = parseFloat($("fStake").value.replace(/[£,\s]/g,""));
    var pv = $("preview"); pv.textContent = "";
    var bad = legs.filter(function(l){ return l.odds && !toDecimal(l.odds); }).length;
    var ready = legs.every(function(l){ return toDecimal(l.odds); });
    if(bad){ pv.textContent = "Odds not recognised. Try 5/2, evens or 3.5."; return; }
    if(ready && stake > 0){
      var dec = legs.reduce(function(a,l){ return a * toDecimal(l.odds); }, 1);
      pv.appendChild(document.createTextNode(frac(dec) + " · returns "));
      pv.appendChild(el("b",null,gbp(stake*dec)));
    } else {
      pv.textContent = "Add stake and odds to see the payout.";
    }
  }
  function lastStake(){ for(var i=0;i<bets.length;i++){ if(bets[i].stake) return String(bets[i].stake); } return ""; }
  var NEW = "__new__";
  function fillNames(){
    [0,1,2].forEach(function(i){
      var sel = $("n"+i), cur = sel.value; sel.textContent = "";
      MEMBERS.forEach(function(m){ var o=document.createElement("option"); o.value=m; o.textContent=m; sel.appendChild(o); });
      var add=document.createElement("option"); add.value=NEW; add.textContent="+ Add someone new…"; sel.appendChild(add);
      if(cur && MEMBERS.indexOf(cur)>=0) sel.value = cur;
    });
  }
  function setPicker(i, name){
    if(name && MEMBERS.indexOf(name) < 0){ MEMBERS.push(name); fillNames(); }
    $("n"+i).value = name || MEMBERS[i % MEMBERS.length];
  }
  [0,1,2].forEach(function(i){
    $("n"+i).addEventListener("change",function(){
      var sel = $("n"+i);
      if(sel.value !== NEW) return;
      var name = (prompt("Name of the new syndicate member") || "").trim().slice(0,40);
      if(!name){ sel.value = MEMBERS[i % MEMBERS.length]; return; }
      var match = MEMBERS.filter(function(m){ return m.toLowerCase()===name.toLowerCase(); })[0];
      setPicker(i, match || name);
    });
  });
  function openSheet(b){
    editingId = b ? b.id : null;
    fillNames();
    $("sheetTitle").textContent = b ? "Edit treble" : "New treble";
    $("saveBtn").textContent = b ? "Save changes" : "Add treble";
    $("fStake").value = b ? String(b.stake||"") : lastStake();
    var legs = b ? legsOf(b) : [];
    var prevNames = bets.length ? legsOf(bets[0]) : [];
    [0,1,2].forEach(function(i){
      var L = legs[i];
      setPicker(i, L ? L.name : (prevNames[i] ? prevNames[i].name : MEMBERS[i % MEMBERS.length]));
      var key = L ? (L.fixture ? fkey(L.fixture) : (L.pick ? CUSTOM : "")) : "";
      fillFixtures(i, key);
      $("x"+i).value = L && !L.fixture ? (L.pick||"") : "";
      fillOutcomes(i, L && L.fixture ? (L.outcome||"") : "");
      $("o"+i).value = L ? (L.odds||"") : "";
    });
    $("fErr").textContent = "";
    var del = $("delBtn"); if(del) del.remove();
    if(b){
      var d = el("button","btn secondary","Delete"); d.id="delBtn"; d.type="button"; d.style.color="var(--loss)"; d.style.flex="0 0 auto"; d.style.padding="13px 16px";
      d.addEventListener("click",function(){ removeBet(b.id); });
      $("cancelBtn").parentNode.insertBefore(d,$("cancelBtn"));
    }
    updatePreview();
    $("sheetRoot").classList.add("open");
    setTimeout(function(){ ($("fStake").value ? $("f0") : $("fStake")).focus(); }, 60);
  }
  function closeSheet(){ $("sheetRoot").classList.remove("open"); editingId = null; }
  $("fab").addEventListener("click",function(){ openSheet(null); });
  $("cancelBtn").addEventListener("click",closeSheet);
  $("scrim").addEventListener("click",closeSheet);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && $("sheetRoot").classList.contains("open")) closeSheet(); });
  ["fStake","o0","o1","o2"].forEach(function(id){ $(id).addEventListener("input",updatePreview); });
  ["fStake","x0","o0","x1","o1","x2","o2"].forEach(function(id){ $(id).addEventListener("keydown",function(e){ if(e.key==="Enter") save(); }); });
  $("saveBtn").addEventListener("click",save);
  function showError(msg){ $("fErr").textContent = msg; }
  function showBanner(msg){ var b=$("banner"); b.textContent=msg; b.style.display = msg ? "block":"none"; }

  // ---- GitHub storage ----
  // Works out the repo from the GitHub Pages address (username.github.io/repo/).
  var CONFIG = { owner: "", repo: "", path: "data.json" };
  (function(){
    var h = location.hostname, m = h.match(/^([^.]+)\.github\.io$/i);
    if(m){
      CONFIG.owner = CONFIG.owner || m[1];
      var seg = location.pathname.split("/").filter(Boolean)[0];
      CONFIG.repo = CONFIG.repo || (seg && !/\.html?$/i.test(seg) ? seg : m[1] + ".github.io");
    }
  })();
  var API = function(){ return "https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/contents/" + CONFIG.path; };
  var sha = null;
  function token(){ try { return localStorage.getItem("fbs-gh-token") || ""; } catch(e){ return ""; } }
  function setToken(t){ try { if(t) localStorage.setItem("fbs-gh-token", t); else localStorage.removeItem("fbs-gh-token"); } catch(e){} }
  function headers(){ var h = {"Accept":"application/vnd.github+json"}; var t = token(); if(t) h.Authorization = "Bearer " + t; return h; }
  function b64decode(str){ var bin = atob(str.replace(/\s/g,"")); var bytes = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function b64encode(str){ var bytes = new TextEncoder().encode(str), bin=""; for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }
  function applyState(st){
    STATE = st || {bets:[]};
    if(Array.isArray(STATE.members) && STATE.members.length) MEMBERS = STATE.members.slice();
    bets = (Array.isArray(STATE.bets) ? STATE.bets : []).slice().sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    loaded = true;
  }
  var lastStamp = null, etag = null;
  async function load(){
    if(!CONFIG.owner || !CONFIG.repo){ loaded = true; showBanner("Set the GitHub owner and repo at the top of the script, or open this page from its GitHub Pages link."); render(); return; }
    try{
      var h = headers(); if(etag) h["If-None-Match"] = etag;
      var r = await fetch(API(), {headers: h, cache: "no-store"});
      if(r.status === 304) return; // unchanged; doesn’t count against GitHub’s limit
      if(r.status === 404){ sha = null; if(!loaded){ applyState({bets:[]}); render(); } return; }
      if(!r.ok) throw new Error(String(r.status));
      etag = r.headers.get("ETag") || null;
      var j = await r.json();
      sha = j.sha;
      if(j.sha === lastStamp) return;
      lastStamp = j.sha;
      if($("sheetRoot").classList.contains("open") || saving) return;
      applyState(JSON.parse(b64decode(j.content)));
      showBanner("");
      render();
    }catch(e){
      if(!loaded){ loaded = true; render(); }
      showBanner("Can’t reach the bets right now. They’ll load when the connection returns.");
    }
  }

  async function commit(nextBets, inSheet){
    if(saving) return;
    saving = true;
    $("saveBtn").disabled = true; $("saveBtn").textContent = "Saving…";
    showBanner("Saving…");
    var next = {members: MEMBERS, bets: nextBets, updatedAt: Date.now()};
    try{
      var body = {message: "Update bets", content: b64encode(JSON.stringify(next, null, 1))};
      if(sha) body.sha = sha;
      var r = await fetch(API(), {method:"PUT", headers: Object.assign({"Content-Type":"application/json"}, headers()), body: JSON.stringify(body)});
      if(!r.ok){ var err = new Error("save"); err.status = r.status; throw err; }
      var j = await r.json();
      sha = j.content && j.content.sha; lastStamp = sha;
      applyState(next);
      showBanner("");
      if($("sheetRoot").classList.contains("open")) closeSheet();
      render();
    }catch(e){
      var st = e && e.status, msg = "Couldn’t save. Check your connection and try again.";
      if(st === 401){ msg = "Your GitHub key isn’t working. Sign in again as organiser."; setToken(""); canWrite = false; applyWriteState(); }
      else if(st === 403 || st === 404){ msg = "Your GitHub key can’t write to this repo. Check it has Contents read and write access."; }
      else if(st === 409 || st === 422){ msg = "The bets changed elsewhere. Reloaded the latest, try again."; lastStamp = null; saving = false; await load(); }
      if(inSheet && $("sheetRoot").classList.contains("open")){ showError(msg); showBanner(""); } else showBanner(msg);
    }finally{
      saving = false; $("saveBtn").disabled = false; $("saveBtn").textContent = editingId ? "Save changes" : "Add treble";
    }
  }

  function save(){
    if(saving) return;
    var stake=parseFloat($("fStake").value.replace(/[£,\s]/g,""));
    var legs=formLegs();
    if(!(stake>0)) return showError("Add the stake in pounds.");
    for(var i=0;i<3;i++){
      if(!legs[i].name || legs[i].name===NEW) return showError("Add who’s picking leg " + (i+1) + ".");
      if(!legs[i].key) return showError("Choose a fixture for leg " + (i+1) + ".");
      if(legs[i].custom && !legs[i].pick) return showError("Type the bet for leg " + (i+1) + ".");
      if(!legs[i].custom && !legs[i].outcome) return showError("Choose the result for leg " + (i+1) + ".");
      if(!toDecimal(legs[i].odds)) return showError("Check the odds for leg " + (i+1) + ". Try 5/2, evens or 3.5.");
    }
    showError("");
    var old = editingId ? bets.filter(function(b){ return b.id===editingId; })[0] : null;
    var cleanLegs = legs.map(function(l,i){
      var prev = old && legsOf(old)[i];
      return {name:l.name.slice(0,40), pick:l.pick.slice(0,80), odds:l.odds.slice(0,10), fixture:l.fixture, outcome:l.outcome || null,
        result: prev && prev.pick===l.pick && !prev.auto ? (prev.result||"open") : "open"};
    });
    var fields = {stake:Math.round(stake*100)/100, legs:cleanLegs};
    var next;
    if(editingId){
      next = bets.map(function(b){ return b.id===editingId ? Object.assign({}, b, fields) : b; });
    } else {
      var id = "b" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      next = [Object.assign({id:id,createdAt:Date.now()}, fields)].concat(bets);
    }
    commit(next, true);
  }
  function setLeg(id, idx, result){
    commit(bets.map(function(b){
      if(b.id!==id) return b;
      var legs = (b.legs||[]).map(function(l,i){ return i===idx ? Object.assign({}, l, {result:result}) : l; });
      return Object.assign({}, b, {legs:legs});
    }), false);
  }
  function removeBet(id){
    if(!confirm("Delete this bet for everyone?")) return;
    commit(bets.filter(function(b){ return b.id!==id; }), true);
  }
  function applyWriteState(){ $("fab").style.display = canWrite ? "block" : "none"; render(); }

  $("orgBtn").addEventListener("click", async function(){
    if(canWrite){ setToken(""); canWrite = false; applyWriteState(); return; }
    var t = (prompt("Paste your GitHub key (fine-grained token with Contents read and write on this repo). It stays on this device only.") || "").trim();
    if(!t) return;
    setToken(t);
    try{
      var r = await fetch("https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo, {headers: headers()});
      var j = r.ok ? await r.json() : null;
      if(j && j.permissions && j.permissions.push){ canWrite = true; showBanner(""); }
      else { setToken(""); canWrite = false; showBanner("That key can’t write to this repo. Check it has Contents read and write access."); }
    }catch(e){ setToken(""); showBanner("Couldn’t check the key. Try again."); }
    applyWriteState();
  });

  canWrite = !!token();
  applyWriteState();
  load();
  loadFixtures();
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible" && Date.now() - FIX_AT > 15*60*1000) loadFixtures(); });
  setInterval(function(){ if(document.visibilityState === "visible") load(); }, 30000);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") load(); });
})();
</script>
