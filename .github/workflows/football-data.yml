name: Football data

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late at busy times)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch team news, lineups, results and Bet365 odds
        run: node scripts/fetch-football.mjs
        env:
          ODDSRELAY_KEY: ${{ secrets.ODDSRELAY_KEY }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save to repo
        run: |
          git config user.name "flash-boys-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fpl.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Update football data"
          git pull --rebase
          git push
