name: Fetch history

on:
  workflow_dispatch:        # run it from the Actions tab
  schedule:
    - cron: "30 6 * * 1"   # and refresh every Monday morning

permissions:
  contents: write

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download results, closing odds and Elo ratings
        run: node scripts/fetch-history.mjs
      - name: Save to repo
        run: |
          git config user.name "flash-boys-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Update history data"
          git pull --rebase
          git push
